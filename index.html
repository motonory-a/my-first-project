<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="生年月日といくつかの質問から、今のあなたに合う天然石を選び、ブレスレットを3つのデザインでご提案。数秘術と九星気学で近々の運勢も。高次元SHOPのオーダーメイド診断です。">
<meta property="og:title" content="大開運！天然石ブレスレットのオーダーメイド！">
<meta property="og:description" content="あなただけの天然石ブレスレットを3つのデザインでご提案。近々の運勢もわかる無料診断。">
<meta property="og:type" content="website">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>大開運！天然石ブレスレットのオーダーメイド！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&family=Allura&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column on a pearl-blush ground; jewelry shown on a plum velvet tray; rose-gold is the one accent */
:root{
  --bg:#FBF6F7;        /* pearl blush */
  --bg2:#F2E8F0;       /* lavender blush */
  --surface:#FFFFFF;
  --ink:#3A2238;       /* deep plum */
  --muted:#806A7B;
  --line:#ECDDE6;
  --rose:#A2645A;      /* rose gold (text-safe) */
  --rose-a:#E2B2A4; --rose-b:#B5786B;
  --soft:#FBEDEA;      /* blush fill for selected */
  --lav:#7C5A9E;
  --line-green:#06C755;
  --warn:#A34A3A;
  --ok:#3E7A5B;
  /* フォント(案4:手書き風 × 細い筆記体)。変えるときはここと build.py のフォント読み込みだけ */
  --f-display:"Klee One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --w-display:600;
  --f-script:"Allura","Snell Roundhand","Segoe Script",cursive;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-latin:"Cormorant Garamond","Times New Roman",serif; /* 英字の小見出し */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B141E;--bg2:#251B29;--surface:#271D2B;--ink:#F4E9F0;--muted:#B9A5B4;--line:#3D2F42;
  --rose:#EBB1A3;--rose-a:#E8B6A8;--rose-b:#B97C6E;--soft:#3A2830;--lav:#C6A9E6;--warn:#F0A08E;--ok:#8FD0AE;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B141E;--bg2:#251B29;--surface:#271D2B;--ink:#F4E9F0;--muted:#B9A5B4;--line:#3D2F42;
  --rose:#EBB1A3;--rose-a:#E8B6A8;--rose-b:#B97C6E;--soft:#3A2830;--lav:#C6A9E6;--warn:#F0A08E;--ok:#8FD0AE;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(60rem 30rem at 110% -10%,var(--bg2),transparent 60%),radial-gradient(40rem 30rem at -20% 30%,var(--soft),transparent 60%);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;letter-spacing:.02em}
.wrap{max-width:540px;margin:0 auto;padding-inline:18px;padding-block:14px 40px}
h1,h2,h3{font-family:var(--f-display);font-weight:var(--w-display);margin:0;line-height:1.5;text-wrap:balance;letter-spacing:.04em}
h2{font-size:23px}
h3{font-size:17px}
p{margin:0}
.latin{font-family:var(--f-script);font-weight:400;color:var(--rose);font-size:34px;line-height:1;letter-spacing:0;margin-bottom:-4px}
.caps{font-family:var(--f-latin);font-weight:600;font-size:11px;letter-spacing:.32em;color:var(--rose);text-transform:uppercase}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--rose);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:26px}
.muted{color:var(--muted)}
.small{font-size:13.5px;line-height:1.75}
.note{font-size:12.5px;color:var(--muted);line-height:1.7}
.center{text-align:center}

/* hero */
.hero{display:flex;flex-direction:column;gap:18px;text-align:center;padding-top:8px}
.cover{position:relative;padding-top:6px}
.cover .script{font-family:var(--f-script);font-size:clamp(46px,14vw,62px);color:var(--rose-b);line-height:1;transform:rotate(-6deg);display:inline-block;margin-bottom:-6px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.title{font-family:var(--f-display);font-weight:var(--w-display);line-height:1.3;margin:0}
.title .big{display:block;font-size:clamp(56px,17vw,76px);letter-spacing:.06em;background:linear-gradient(120deg,var(--rose-b),var(--rose-a) 45%,var(--rose-b));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(255,255,255,.7))}
.title .sub{display:block;font-size:clamp(23px,7vw,30px);letter-spacing:.08em}
.lead{color:var(--muted);font-size:15px;line-height:1.95;background:radial-gradient(closest-side,var(--bg) 55%,transparent);padding:10px 0}
.cover .title,.cover .script{text-shadow:0 0 18px var(--bg)}
.rule{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--rose)}
.rule::before,.rule::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--rose-a))}
.rule::after{transform:scaleX(-1)}
.spark{color:var(--rose-a);font-size:14px;letter-spacing:.6em}
.points{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.points div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 6px;font-size:12px;color:var(--muted);line-height:1.5}
.points b{display:block;font-family:var(--f-display);font-weight:var(--w-display);font-size:18px;color:var(--ink);margin-bottom:2px}

.tray{background:#F3F1EF;border-radius:24px;overflow:hidden;width:100%;max-width:440px;margin-inline:auto;border:1px solid var(--line);box-shadow:0 18px 40px -26px rgba(58,34,56,.35)}
.tray canvas{display:block;width:100%;aspect-ratio:1/1;height:auto}

/* buttons */
.btn{appearance:none;border:0;border-radius:999px;padding:15px 22px;font:700 16px/1.2 var(--f-body);letter-spacing:.06em;cursor:pointer;width:100%;text-align:center;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px;transition:transform .12s ease,opacity .15s ease,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.38;cursor:not-allowed}
.btn.rose{background:linear-gradient(120deg,var(--rose-b),var(--rose-a));color:#fff;box-shadow:0 10px 22px -12px rgba(162,100,90,.8)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.line{background:var(--line-green);color:#fff}
.btn.small{padding:10px 16px;font-size:14px;width:auto}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.tab:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

/* question screens */
.progress{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--rose-a),var(--rose-b));transition:width .35s ease}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;padding:4px 0}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 16px;font:500 15.5px/1.5 var(--f-body);color:var(--ink);cursor:pointer}
.opt .mk{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--rose-b);background:var(--soft)}
.opt[aria-pressed="true"] .mk{border-color:var(--rose-b);background:var(--rose-b)}
.opt[aria-pressed="true"] .mk::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font:500 14.5px/1.3 var(--f-body);color:var(--ink);cursor:pointer}
.chip .sw{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.chip[aria-pressed="true"]{border-color:var(--rose-b);background:var(--soft)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
label.f .req{color:var(--rose);font-weight:500;font-size:12px}
input[type=text],input[type=date],input[type=tel],textarea,select{width:100%;font:16px/1.5 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
textarea{min-height:100px;resize:vertical}
.err{color:var(--warn);font-size:13px;min-height:1em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.linebox{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--rose-b);flex:none;margin-top:3px}

/* fortune */
.fortune{background:linear-gradient(160deg,var(--surface),var(--soft));border:1px solid var(--line);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.stars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.star{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.star small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.08em}
.star b{display:block;font-family:var(--f-display);font-weight:var(--w-display);font-size:20px;margin-block:2px}
.star span{font-size:12.5px;color:var(--rose)}
.kw{text-align:center;padding:18px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;align-items:center}
.kwword{font-family:var(--f-display);font-weight:var(--w-display);font-size:clamp(28px,8.5vw,36px);line-height:1.35;background:linear-gradient(120deg,var(--rose-b),var(--rose-a) 50%,var(--rose-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.kwcatch{font-family:var(--f-display);font-weight:var(--w-display);font-size:16px;text-wrap:balance;max-width:20em}
.rate{color:var(--rose-b);letter-spacing:.08em;font-size:15px;white-space:nowrap}
.rate i{font-style:normal;color:var(--line)}
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cats li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ch b,.ch em{font-family:var(--f-display);font-weight:var(--w-display);font-style:normal;font-size:16px}
.cats p,.month p{font-size:14px;line-height:1.75;margin-top:2px}
.months{display:flex;flex-direction:column;gap:12px}
.month{display:grid;grid-template-columns:3.2em 1fr;gap:10px;align-items:start}
.month>b{font-family:var(--f-display);font-weight:var(--w-display);font-size:18px;color:var(--rose);line-height:1.6}
.month>div{min-width:0}
.lday{color:var(--rose);font-weight:700}
.lucky{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lk.wide{grid-column:1/-1}
.lk small{font-family:var(--f-latin);font-weight:600;font-size:10.5px;letter-spacing:.24em;color:var(--rose)}
.lk b{font-family:var(--f-display);font-weight:var(--w-display);font-size:15.5px;line-height:1.5}
.lk.lkstone{background:linear-gradient(135deg,var(--surface),var(--soft))}
.lcs{display:flex;gap:8px;flex-wrap:wrap}
.lc{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.lc .sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.akki{background:var(--surface);border-radius:18px;padding:16px;border:1px dashed var(--rose-a)}
.akki p{font-size:14.5px;margin-top:4px}
mark{background:var(--soft);color:var(--ink);padding:0 3px;border-radius:4px}

/* designs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font:700 12.5px/1.3 var(--f-body)}
.tab canvas{width:100%;max-width:120px;aspect-ratio:1/1;border-radius:12px;display:block}
.tab[aria-selected="true"]{border-color:var(--rose-b);background:var(--soft);box-shadow:0 0 0 1px var(--rose-b) inset}
.tab small{font-weight:500;color:var(--muted);font-size:10.5px;letter-spacing:.08em}
.dname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stone{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start}
.stone canvas{width:56px;height:56px;border-radius:14px}
.stone>div{min-width:0}
.role{font-size:11.5px;letter-spacing:.12em;color:var(--rose);font-weight:700}
.why{font-size:14.5px;margin-top:2px}
.spec{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;line-height:1.7}
.adj{display:flex;flex-wrap:wrap;gap:8px}
.divider{height:1px;background:var(--line)}
.flowsteps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.flowsteps li{text-wrap:pretty;list-style:none;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;align-items:start}
.flowsteps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--rose);font:700 13px/26px var(--f-body);text-align:center}
.flowsteps{padding:0;margin:0}
.toast{font-size:13px;color:var(--ok);min-height:1.2em}
pre.out{white-space:pre-wrap;font:13px/1.7 var(--f-body);background:var(--bg2);border-radius:12px;padding:12px;margin:0;max-height:260px;overflow:auto}
.shareimg{width:100%;border-radius:16px;border:1px solid var(--line)}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px;text-align:center}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.heroimg{margin:0;border-radius:26px;overflow:hidden;box-shadow:0 22px 44px -24px rgba(162,100,90,.55),0 0 0 1px rgba(255,255,255,.7) inset;max-width:100%}
.heroimg img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}

h1,h2,h3,.kwcatch,.lead,.cats p,.month p,.lk b,.why,.akki p{word-break:auto-phrase}

.fbk{border:1px dashed var(--rose-a)}
.fq{display:flex;flex-direction:column;gap:6px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 0;font:700 16px/1 var(--f-body);cursor:pointer}
.scale button[aria-pressed="true"]{background:linear-gradient(120deg,var(--rose-b),var(--rose-a));border-color:var(--rose-b);color:#fff}

/* 背景:フラワーオブライフ(上部の連続模様に金の紋を重ね、下へ溶かす/左下にローズゴールドの紋) */

/* ---------- 診断ロジック ---------- */
function addTags(acc,tags,w=1){for(const t in tags) acc[t]=(acc[t]||0)+tags[t]*w}
function keywordTags(text){
  const map=[[/お金|収入|金運|資産|給料/,{money:2}],[/仕事|転職|独立|起業|事業|会社|売上/,{work:2}],[/恋|出会い|彼氏|彼女|好きな人/,{love:1,newlove:1}],
    [/結婚|夫婦|婚活/,{marriage:2}],[/人間関係|職場|家族|友人/,{communication:1,protect:1}],[/疲れ|不安|ストレス|眠れ/,{calm:2,relax:1}],
    [/自信/,{confidence:2}],[/北投石/,{hokuto:3}],[/集中/,{focus:2}],[/決め|決断|迷/,{decision:2}],[/続け|継続/,{continue:2}],[/挑戦|新しい/,{chance:1,action:1}]];
  const acc={},hits=[];
  for(const [re,t] of map){const m=text.match(re); if(m){addTags(acc,t); hits.push(m[0])}}
  return {acc,hits};
}

function layoutN(d,n){
  const h=(n-1)/2, v=d.variant%3;
  const tot=d.w.reduce((a,b)=>a+b,0);
  let s=Math.round(n*d.w[1]/tot), c=d.ids.length>2?Math.round(n*d.w[2]/tot):0;
  const maxAcc=n-Math.ceil(n*.4); // メインは最低4割
  while(s+c>maxAcc){ if(c>s/2&&c>0) c--; else s--; }
  s=Math.max(s,1);
  if(v===2){ if(s%2) s+= (s+1+c<=maxAcc)?1:-1; if(c%2) c-=1; s=Math.max(s,2); }
  else if(s%2&&c%2) c-=1;
  const front = s%2?1 : c%2?2 : 0;
  const half=Array(h+1).fill(0);
  const sp=Math.floor(s/2), cp=Math.floor(c/2);
  const free=i=>i>=1&&i<=h&&half[i]===0;
  const nearestFree=p=>{for(let dlt=0;dlt<=h;dlt++){if(free(p+dlt))return p+dlt; if(free(p-dlt))return p-dlt} return -1};
  const fillGaps=(type,count)=>{ // 同じ石が続かないよう、いちばん長い空きの真ん中に置く
    for(let k=0;k<count;k++){
      let best=-1,bestLen=-1,run=0,start=1;
      for(let i=1;i<=h+1;i++){
        if(i<=h&&half[i]===0){ if(run===0)start=i; run++; }
        else { if(run>0){ const len=run+(start===1&&front===0?.5:0); if(len>bestLen){bestLen=len;best=Math.round(start+(run-1)/2)} } run=0; }
      }
      if(best<0)return; half[best]=type;
    }
  };
  if(v===0){
    for(let k=1;k<=sp;k++){ const p=Math.round((s%2? k : k-.5)*n/s); const q=nearestFree(Math.min(h,Math.max(1,p))); if(q>0) half[q]=1; }
    let left=cp;
    if(left>0 && front===1 && free(1)){ half[1]=2; left--; }
    else if(left>0){ const st=half.indexOf(1); if(st>0){ if(free(st-1)){half[st-1]=2;left--} else if(free(st+1)){half[st+1]=2;left--} } }
    fillGaps(2,left);
  } else if(v===1){
    const q=[]; let a=sp,b=cp; let turn = front===1?2:1;
    while(a>0||b>0){ if(turn===1&&a>0){q.push(1);a--} else if(turn===2&&b>0){q.push(2);b--} else if(a>0){q.push(1);a--} else {q.push(2);b--} turn=turn===1?2:1; }
    q.forEach((t,i)=>half[i+1]=t);
  } else {
    let p=h; for(let k=0;k<sp;k++) half[p--]=1;
    for(let k=0;k<cp;k++) half[p--]=2;
  }
  const seq=Array(n);
  seq[0]=front; for(let i=1;i<=h;i++){seq[i]=half[i]; seq[n-i]=half[i]}
  const gaps=new Set(); // g = 玉gとg+1の間
  if(d.spacer==="front"){ gaps.add(n-1); gaps.add(0); }
  if(d.spacer==="stations"){ seq.forEach((t,k)=>{ if(t===1){ gaps.add((k-1+n)%n); gaps.add(k); } }); }
  return {seq,gaps,n};
}

/* ---- 色の小道具 ---- */
const hx=h=>{const n=parseInt(h.slice(1),16);return [n>>16,n>>8&255,n&255]};
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("")};
const lt=(c,t)=>mix(c,"#ffffff",t), dk=(c,t)=>mix(c,"#000000",t);
const rgba=(c,a)=>{const [r,g,b]=hx(c);return `rgba(${r},${g},${b},${a})`};
function rng(seed){let s=(seed*2654435761)>>>0||1; return ()=>{s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296}}
function rg(ctx,x0,y0,r0,x1,y1,r1,stops){const g=ctx.createRadialGradient(x0,y0,r0,x1,y1,r1); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g}
function blob(ctx,x,y,r,col,a){ctx.fillStyle=rg(ctx,x,y,0,x,y,r,[[0,rgba(col,a)],[1,rgba(col,0)]]); ctx.fillRect(x-r,y-r,2*r,2*r)}

function drawSurface(ctx,W,H){

  ctx.fillRect(0,0,W,H);
  const t=SURFACE.tex;
  if(t==="velvet"){ for(let i=0;i<W*H/9;i++){ ctx.fillStyle=r()>.5?"rgba(255,255,255,.025)":"rgba(0,0,0,.05)"; ctx.fillRect(r()*W,r()*H,1,1); }
    for(let i=0;i<14;i++){ const bx=r()*W, by=r()*H, br=W*(.01+r()*.035); ctx.fillStyle=rg(ctx,bx,by,0,bx,by,br,[[0,`rgba(255,226,214,${.05+r()*.08})`],[1,"rgba(255,226,214,0)"]]); ctx.beginPath(); ctx.arc(bx,by,br,0,6.28); ctx.fill(); } }
  if(t==="stone"){ for(let i=0;i<9;i++) blob(ctx,r()*W,r()*H,W*(.15+r()*.3),r()>.5?"#FFFFFF":"#B9AFB2",r()>.5?.28:.05);
    for(let i=0;i<W*H/10;i++){ ctx.fillStyle=r()>.5?"rgba(255,255,255,.06)":"rgba(110,95,100,.025)"; ctx.fillRect(r()*W,r()*H,1,1); } }
  if(t==="marble"){ for(let i=0;i<W*H/14;i++){ ctx.fillStyle=r()>.5?"rgba(255,255,255,.05)":"rgba(90,80,90,.03)"; ctx.fillRect(r()*W,r()*H,1,1); }
    for(let i=0;i<7;i++){ let x0=r()*W*1.2-W*.1, y0=r()*H*1.2-H*.1; ctx.strokeStyle=`rgba(120,110,118,${.05+r()*.09})`; ctx.lineWidth=W*(.001+r()*.004); ctx.beginPath(); ctx.moveTo(x0,y0);
      for(let k=0;k<4;k++){ const x1=x0+(r()-.3)*W*.4, y1=y0+(r()-.2)*H*.35; ctx.quadraticCurveTo(x0+(r()-.5)*W*.3,y0+(r()-.5)*H*.3,x1,y1); x0=x1; y0=y1; } ctx.stroke(); }
    ctx.strokeStyle="rgba(196,160,110,.12)"; ctx.lineWidth=W*.002; ctx.beginPath(); ctx.moveTo(-10,H*.15); ctx.bezierCurveTo(W*.3,H*.3,W*.5,H*.05,W+10,H*.35); ctx.stroke(); }
  if(t==="satin"){ for(let i=0;i<5;i++){ const off=(r()-.5)*W*1.4; const g=ctx.createLinearGradient(off,0,off+W*.5,H); g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(.5,`rgba(255,255,255,${.12+r()*.18})`); g.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
    for(let i=0;i<4;i++){ const off=(r()-.5)*W*1.4; const g=ctx.createLinearGradient(off,0,off+W*.35,H); g.addColorStop(0,"rgba(80,40,50,0)"); g.addColorStop(.5,"rgba(80,40,50,.05)"); g.addColorStop(1,"rgba(80,40,50,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); } }
  if(t==="linen"){ for(let y=0;y<H;y+=1.5){ ctx.fillStyle=`rgba(255,255,255,${r()*.035})`; ctx.fillRect(0,y,W,.7); } for(let x=0;x<W;x+=1.5){ ctx.fillStyle=`rgba(90,70,60,${r()*.025})`; ctx.fillRect(x,0,.7,H); } }
}
function drawShadow(ctx,x,y,r,id){
  const L=LOOK[id], clear=L.kind==="clear";
  const k=SURFACE.light?.5:1;
  ctx.fillStyle=rg(ctx,x+r*.22,y+r*.3,r*.2,x+r*.22,y+r*.3,r*1.32,[[0,`rgba(40,20,30,${(clear?.38:.6)*k})`],[.7,`rgba(40,20,30,${(clear?.12:.2)*k})`],[1,"rgba(0,0,0,0)"]]);
  ctx.beginPath(); ctx.arc(x+r*.22,y+r*.3,r*1.32,0,Math.PI*2); ctx.fill();
  if(clear){ const c=lt(L.tint,.5); blob(ctx,x+r*.62,y+r*.8,r*.5,SURFACE.light?lt(L.tint,.7):c,SURFACE.light?.55:.28); if(SURFACE.light) blob(ctx,x+r*.66,y+r*.86,r*.22,"#FFFFFF",.8); }
  else if(L.kind==="trans"&&SURFACE.light){ blob(ctx,x+r*.62,y+r*.82,r*.45,lt(L.color,.35),.35); }
}
function twinkle(ctx,x,y,s,a){
  ctx.save(); ctx.translate(x,y); ctx.globalCompositeOperation="lighter";
  ctx.fillStyle=rg(ctx,0,0,0,0,0,s*.45,[[0,`rgba(255,255,255,${a*.7})`],[1,"rgba(255,255,255,0)"]]); ctx.beginPath(); ctx.arc(0,0,s*.45,0,6.28); ctx.fill();
  const ray=(len,w,rot)=>{ctx.save(); ctx.rotate(rot); const gr=ctx.createLinearGradient(-len,0,len,0); gr.addColorStop(0,"rgba(255,255,255,0)"); gr.addColorStop(.5,`rgba(255,255,255,${a})`); gr.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(-len,0); ctx.lineTo(0,-w); ctx.lineTo(len,0); ctx.lineTo(0,w); ctx.closePath(); ctx.fill(); ctx.restore()};
  ray(s,s*.06,0); ray(s,s*.06,Math.PI/2); ray(s*.5,s*.04,Math.PI/4); ray(s*.5,s*.04,-Math.PI/4);
  ctx.restore();
}

function drawRondelle(ctx,x,y,r,ang,metal){

  twinkle(ctx,x-r*.06,y-r*.1,r*.55,.85);

function drawBracelet(canvas,d,scaleOverride){
  const dpr=scaleOverride||Math.min(window.devicePixelRatio||1,3), W=400, H=400;
  canvas.width=W*dpr; canvas.height=H*dpr; const ctx=canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  drawSurface(ctx,W,H);
  const {seq,gaps,n}=layout(d);
  const t=.6; // 金具の厚み(玉半径を1とした比)
  // 玉が隙間なく接する半径Rを求める
  const total=R=>{let a=0; for(let k=0;k<n;k++){ a+=2*Math.asin(Math.min(1,(gaps.has(k)?2+t:2)/2/R)); } return a};
  let lo=1.01,hi=200; for(let i=0;i<60;i++){const m=(lo+hi)/2; if(total(m)>2*Math.PI) lo=m; else hi=m;}
  const Rn=(lo+hi)/2, scale=(W*.43)/(Rn+1.05), R=Rn*scale, r=scale;
  const cx=W/2, cy=H/2;
  const pos=[]; let a=Math.PI/2;
  for(let k=0;k<n;k++){ pos.push(a); a+=2*Math.asin((gaps.has(k)?2+t:2)/2/Rn); }
  // 個体差(天然石らしいわずかな大きさのゆらぎ)
  const rr=rng(d.seed*31+n); const sizes=pos.map(()=>r*(1+(rr()-.5)*.025));
  pos.forEach((p,k)=>drawShadow(ctx,cx+Math.cos(p)*R,cy+Math.sin(p)*R,sizes[k],d.ids[seq[k]]));
  const rs=rng(d.seed*7+3);
  gaps.forEach(k=>{ const p1=pos[k], p2=k+1<n?pos[k+1]:pos[0]+2*Math.PI; const m=(p1+p2)/2; drawRondelle(ctx,cx+Math.cos(m)*R,cy+Math.sin(m)*R,r,m,d.metal); });
  pos.forEach((p,k)=>{ const rb=rng(d.seed*1000+k*17+seq[k]*5); drawBead(ctx,cx+Math.cos(p)*R,cy+Math.sin(p)*R,sizes[k],d.ids[seq[k]],rb,p); });
  // 全体の周辺減光
  ctx.fillStyle=rg(ctx,cx,cy,W*.35,cx,cy,W*.75,[[0,"rgba(0,0,0,0)"],[1,`rgba(0,0,0,${SURFACE.light?.07:.35})`]]); ctx.fillRect(0,0,W,H);
  return seq;
}

/* ---------- デザインを共有リンクにする ---------- */
function encodeDesign(d,name){
  const o={i:d.ids,w:d.w.map(x=>Math.round(x*10)/10),s:d.size,p:d.spacer,m:d.metal,v:d.variant,e:d.seed,r:d.wrist,n:name};
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeDesign(str){
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(str.replace(/-/g,"+").replace(/_/g,"/")))));
    if(!Array.isArray(o.i)||!o.i.every(id=>STONES[id])||o.i.length<1||o.i.length>4) return null;
    const num=(x,a,b,def)=>typeof x==="number"&&x>=a&&x<=b?x:def;
    return {d:{ids:o.i,w:(Array.isArray(o.w)&&o.w.length===o.i.length)?o.w.map(x=>num(x,.1,50,1)):o.i.map((_,k)=>[6,3,2,1][k]),size:[8,10,12].includes(o.s)?o.s:10,spacer:SPACERS[o.p]!==undefined?o.p:"none",metal:o.m==="silver"?"silver":"gold",variant:num(o.v,0,2,0),seed:num(o.e,0,1e6,7),wrist:num(o.r,12,22,15.5),log:[]},name:String(o.n||"").slice(0,20)};
  }catch(e){return null}
}

/* ---------- 状態 ---------- */
const BLANK=()=>({step:0,birth:"",lineDone:false,theme:null,ans:{},likeColors:[],avoidColors:[],vibes:[],liked:[],likedOther:"",avoidStones:"",budget:null,free:"",result:null,sel:0,wrist:null,wristUnknown:false,name:"",zip:"",addr:"",note:""});
const S=BLANK();
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);

function flow(){
  const f=[{k:"intro"},{k:"birth",q:1},{k:"theme",q:1}];
  (S.theme?BRANCH[S.theme]:[0]).forEach((b,i)=>f.push({k:"branch",idx:i,q:1}));
  f.push({k:"likeColors",q:1},{k:"avoidColors",q:1},{k:"vibes",q:1},{k:"liked",q:1},{k:"budget",q:1},{k:"free",q:1},{k:"result"},{k:"order"});
  return f;
}
function go(delta){const f=flow(); S.step=Math.max(0,Math.min(f.length-1,S.step+delta)); render(); window.scrollTo({top:0})}
function header(cur){
  const qs=flow().filter(x=>x.q); const i=qs.indexOf(cur)+1;
  return `<div class="stack"><div class="qhead"><button class="back" id="back" type="button">← 戻る</button><span>${i} / ${qs.length}</span></div><div class="progress"><i style="width:${i/qs.length*100}%"></i></div></div>`;
}
function optsHTML(list,sel){return `<div class="opts">${list.map((l,i)=>`<button type="button" class="opt" data-i="${i}" aria-pressed="${sel===i}"><span class="mk"></span>${esc(l)}</button>`).join("")}</div>`}
const nextBtn=(ok,label="次へ")=>`<button class="btn rose" id="next" type="button"${ok?"":" disabled"}>${label}</button>`;
const footer=()=>`<footer><div>運営:<a href="${SHOP_URL}" target="_blank" rel="noopener">高次元SHOP</a>(アッキーの天然石ブレスレット屋さん)</div><div><a href="${LAW_URL}" target="_blank" rel="noopener">特定商取引法に基づく表記</a></div></footer>`;

/* ---------- 画面 ---------- */
function render(){
  const cur=flow()[S.step]; let h="";
  if(cur.k==="intro") h=introHTML();
  else if(cur.k==="birth") h=`<div class="stack-lg">${header(cur)}
    <div class="stack"><div class="latin">Step 1</div><h2>まずは、生年月日と<br>公式LINEの登録だけ。</h2>
    <p class="muted small">お名前やメールアドレスは必要ありません。</p></div>
    <label class="f">生年月日<input type="date" id="bd" value="${esc(S.birth)}" min="1920-01-01" max="2015-12-31"></label>
    <div class="linebox"><b>アッキーの公式LINEに友だち追加</b>
      <p class="small muted">診断のあと、選んだデザインをLINEで送ってご相談いただけます。新しい石やイベントのお知らせも届きます。</p>
      <a class="btn line" id="lineadd" href="${LINE_ADD}" target="_blank" rel="noopener">LINEで友だち追加する</a>
      <label class="check"><input type="checkbox" id="linedone"${S.lineDone?" checked":""}>友だち追加しました(すでに友だちの方もチェック)</label></div>
    <p class="note">生年月日は、数秘術と九星気学で「あなたの星」と近々の流れを読み解くために使います。どこにも送信・保存されません。</p>
    <div class="err" id="err"></div>${nextBtn(true)}</div>`;
  else if(cur.k==="theme"){const sel=THEMES.findIndex(t=>t.id===S.theme);
    h=`<div class="stack-lg">${header(cur)}<h2>今のあなたが、いちばん気になっていることは？</h2>${optsHTML(THEMES.map(t=>t.label),sel)}${nextBtn(sel>=0)}</div>`}
  else if(cur.k==="branch"){const b=BRANCH[S.theme][cur.idx];
    h=`<div class="stack-lg">${header(cur)}<h2>${esc(b.q)}</h2>${optsHTML(b.opts.map(o=>o[0]),S.ans[b.id])}${b.note?`<p class="note">${b.note}</p>`:""}${nextBtn(S.ans[b.id]!=null)}</div>`}
  else if(cur.k==="likeColors"||cur.k==="avoidColors"){const key=cur.k, like=key==="likeColors";
    const list=like?[...COLORS,["any","特にこだわらない",null]]:[...COLORS,["none","特になし",null]];
    h=`<div class="stack-lg">${header(cur)}<h2>${like?"好きな色は？":"苦手な色は？"}</h2><p class="muted small">いくつでも選べます</p>
      <div class="chips">${list.map(c=>`<button type="button" class="chip" data-c="${c[0]}" aria-pressed="${S[key].includes(c[0])}">${c[2]?`<span class="sw" style="background:${c[2]}"></span>`:""}${c[1]}</button>`).join("")}</div>${nextBtn(S[key].length>0)}</div>`}
  else if(cur.k==="vibes") h=`<div class="stack-lg">${header(cur)}<h2>どんな雰囲気のブレスレットが好きですか？</h2><p class="muted small">近いものを3つまで</p>
      <div class="chips">${Object.keys(VIBES).map(x=>`<button type="button" class="chip" data-v="${x}" aria-pressed="${S.vibes.includes(x)}">${x}</button>`).join("")}</div>${nextBtn(S.vibes.length>0)}</div>`;
  else if(cur.k==="liked") h=`<div class="stack-lg">${header(cur)}<h2>好きな石・使いたくない石はありますか？</h2>
      <div class="stack"><b class="small">持っている・好きな石(いくつでも)</b>
      <div class="chips">${[...LIKED,"特にない"].map(x=>`<button type="button" class="chip" data-l="${x}" aria-pressed="${S.liked.includes(x)}">${x}</button>`).join("")}</div></div>
      <label class="f">今回使いたくない石(なければ空欄)<input type="text" id="as" value="${esc(S.avoidStones)}" placeholder="例:オニキス"></label>${nextBtn(true)}</div>`;
  else if(cur.k==="budget") h=`<div class="stack-lg">${header(cur)}<h2>ご希望の価格帯は？</h2>
      <p class="muted small">同じ石でもグレードによってお値段が大きく変わります。最終的なお値段は、LINEのビデオ通話で実物をご覧いただきながら一緒に決めます。</p>${optsHTML(BUDGETS,S.budget)}${nextBtn(S.budget!=null)}</div>`;
  else if(cur.k==="free") h=`<div class="stack-lg">${header(cur)}<h2>最後に、伝えておきたいことがあれば教えてください。</h2>
      <textarea id="fr" placeholder="例:来年独立を考えていて、仕事中も着けられるものが欲しいです。">${esc(S.free)}</textarea>
      <p class="note">空欄でも大丈夫です。書いていただいた内容も石選びに反映します。</p>${nextBtn(true,"結果を見る")}</div>`;
  else if(cur.k==="result") h=resultHTML();
  else if(cur.k==="order") h=orderHTML();
  app.innerHTML=h+footer(); bind(cur);
}

/* ---------- メッセージと画像 ---------- */
function siteURL(){return location.origin&&location.origin!=="null"?location.origin+location.pathname:""}
/* ---------- テスト用の感想フォーム(本番公開時は TEST_MODE=false) ---------- */
const TEST_MODE=true;
const FBQ=[["わかりやすさ","診断は答えやすかったですか？"],["運勢","運勢を読んでワクワクしましたか？"],["デザイン","ブレスレットを作ってみたいと思いましたか？"],["見た目","サイトの見た目は好きですか？"]];
const FB={s:{},good:"",bad:""};
function feedbackHTML(){
  return `<section class="card stack fbk"><div class="latin" style="font-size:28px">Thank you</div><h3>テストへのご協力ありがとうございます</h3>
    <p class="small muted">1〜5で答えて「感想をLINEで送る」を押すと、アッキーの公式LINEに届きます。</p>
    ${FBQ.map((q,i)=>`<div class="fq"><b class="small">${q[1]}</b><div class="scale" data-q="${i}">${[1,2,3,4,5].map(v=>`<button type="button" data-v="${v}" aria-pressed="${FB.s[i]===v}">${v}</button>`).join("")}</div></div>`).join("")}
    <label class="f">よかったところ<textarea id="fbg" style="min-height:70px">${esc(FB.good)}</textarea></label>
    <label class="f">わかりにくかったところ・ご要望<textarea id="fbb" style="min-height:70px">${esc(FB.bad)}</textarea></label>
    <a class="btn line" id="fbsend" href="#" target="_blank" rel="noopener">感想をLINEで送る</a></section>`;
}
function fbText(){
  const R=S.result, D=R.designs[S.sel];
  return [`【サイトのテスト感想】`,...FBQ.map((q,i)=>`■${q[0]}:${FB.s[i]?FB.s[i]+"/5":"未回答"}`),`■よかったところ:${FB.good||"なし"}`,`■わかりにくかったところ・ご要望:${FB.bad||"なし"}`,`―――`,`本命星:${R.F.honName}/選んだデザイン:${D.mode.name}(${D.items.map(i=>STONES[i.id].name).join("・")})`].join("\n");
}
function bindFeedback(){
  const upd=()=>{FB.good=$("fbg").value.trim(); FB.bad=$("fbb").value.trim(); $("fbsend").href=lineURL(fbText())};
  document.querySelectorAll(".scale").forEach(sc=>sc.querySelectorAll("button").forEach(b=>b.onclick=()=>{FB.s[+sc.dataset.q]=+b.dataset.v; sc.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); upd()}));
  $("fbg").oninput=upd; $("fbb").oninput=upd; upd();
}

function orderText(){
  const D=S.result.designs[S.sel], F=S.result.F, sp=specText(D.d);
  const theme=THEMES.find(t=>t.id===S.theme)?.label||"";
  const first=S.theme&&S.ans[BRANCH[S.theme][0].id]!=null?BRANCH[S.theme][0].opts[S.ans[BRANCH[S.theme][0].id]][0]:"";
  const link=siteURL()?`${siteURL()}?d=${encodeDesign(D.d,D.mode.name)}`:"";
  return [`【${SITE_TITLE}】ご相談`,
    `■デザイン:${D.mode.name}デザイン`,
    `■石:${D.items.map(i=>`${i.role} ${STONES[i.id].name}`).join("/")}`,
    `■仕様:${sp.line1}/${sp.line2}/並べ方:${sp.layoutName}`,
    `■ご希望の価格帯:${BUDGETS[S.budget]}`,
    `■生年月日:${S.birth}(${F.honName}/ライフパス${F.lp})`,
    `■テーマ:${theme}${first?"(" + first + ")":""}`,
    `■ご要望:${S.note||"なし"}`, link?`■完成図:${link}`:""].filter(Boolean).join("\n");
}
function lineURL(text){return `https://line.me/R/oaMessage/${LINE_ID}/?${encodeURIComponent(text)}`}

async function makeCard(D){
  try{ await Promise.all(["600 40px 'Klee One'","500 30px 'Zen Maru Gothic'","400 60px 'Allura'"].map(f=>document.fonts.load(f))); }catch(e){}
  const W=1080,H=1500; const c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,"#FBF1F0"); g.addColorStop(1,"#EFE3F0"); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.textAlign="center"; x.fillStyle="#B5786B"; x.font="400 74px 'Allura',cursive"; x.save(); x.translate(W/2,78); x.rotate(-.06); x.fillText("Lucky Stone Order",0,0); x.restore();
  const tg=x.createLinearGradient(300,0,780,0); tg.addColorStop(0,"#B5786B"); tg.addColorStop(.5,"#E2B2A4"); tg.addColorStop(1,"#B5786B");
  x.fillStyle=tg; x.font="600 84px 'Klee One',sans-serif"; x.fillText("大開運！",W/2,194);
  x.fillStyle="#3A2238"; x.font="600 44px 'Klee One',sans-serif"; x.fillText("天然石ブレスレットのオーダーメイド！",W/2,252);
  const bc=document.createElement("canvas"); drawBracelet(bc,D.d,2.4); // 960px
  const bx=60,by=280,bs=960; x.save(); x.beginPath(); x.roundRect?x.roundRect(bx,by,bs,bs,48):x.rect(bx,by,bs,bs); x.clip(); x.drawImage(bc,bx,by,bs,bs); x.restore();
  const sp=specText(D.d);
  x.fillStyle="#3A2238"; x.font="600 46px 'Klee One',sans-serif"; x.fillText(`${D.mode.name}デザイン`,W/2,1320);
  x.font="500 30px 'Zen Maru Gothic',sans-serif"; x.fillStyle="#5E4A5B"; x.fillText(D.items.map(i=>STONES[i.id].name).join(" × "),W/2,1374);
  x.font="500 25px 'Zen Maru Gothic',sans-serif"; x.fillStyle="#806A7B"; x.fillText(sp.line1,W/2,1420);
  x.fillText(`高次元SHOP ・ 公式LINE ${LINE_ID}`,W/2,1466);
  return c;
}

/* ---------- 操作 ---------- */
function bind(cur){
  $("back")&&($("back").onclick=()=>go(-1));
  if(cur.k==="intro"){ $("start").onclick=()=>go(1); }
  if(cur.k==="birth"){
    $("lineadd").addEventListener("click",()=>{S.lineDone=true; setTimeout(()=>{$("linedone").checked=true},300)});
    $("linedone").onchange=e=>S.lineDone=e.target.checked;
    $("next").onclick=()=>{S.birth=$("bd").value;
      const e=!S.birth?"生年月日を入力してください。":!S.lineDone?"公式LINEに友だち追加して、チェックを入れてください。":"";
      if(e){$("err").textContent=e;return} S.result=null; go(1)};
  }
  if(cur.k==="theme"){app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const t=THEMES[+b.dataset.i].id; if(t!==S.theme) S.ans={}; S.theme=t; S.result=null; render()}); $("next").onclick=()=>go(1)}
  if(cur.k==="branch"){const b=BRANCH[S.theme][cur.idx]; app.querySelectorAll(".opt").forEach(x=>x.onclick=()=>{S.ans[b.id]=+x.dataset.i; S.result=null; render()}); $("next").onclick=()=>go(1)}
  if(cur.k==="likeColors"||cur.k==="avoidColors"){const key=cur.k, solo=key==="likeColors"?"any":"none";
    app.querySelectorAll(".chip").forEach(x=>x.onclick=()=>{const c=x.dataset.c; let a=S[key]; if(c===solo) a=a.includes(c)?[]:[c]; else {a=a.filter(z=>z!==solo); a=a.includes(c)?a.filter(z=>z!==c):[...a,c]} S[key]=a; S.result=null; render()});
    $("next").onclick=()=>go(1)}
  if(cur.k==="vibes"){app.querySelectorAll(".chip").forEach(x=>x.onclick=()=>{const v=x.dataset.v; let a=S.vibes; a=a.includes(v)?a.filter(z=>z!==v):(a.length<3?[...a,v]:a); S.vibes=a; S.result=null; render()}); $("next").onclick=()=>go(1)}
  if(cur.k==="liked"){
    app.querySelectorAll(".chip").forEach(x=>x.onclick=()=>{S.avoidStones=$("as").value; const v=x.dataset.l; let a=S.liked; if(v==="特にない") a=a.includes(v)?[]:[v]; else {a=a.filter(z=>z!=="特にない"); a=a.includes(v)?a.filter(z=>z!==v):[...a,v]} S.liked=a; S.result=null; render()});
    $("next").onclick=()=>{S.avoidStones=$("as").value.trim(); S.result=null; go(1)}}
  if(cur.k==="budget"){app.querySelectorAll(".opt").forEach(x=>x.onclick=()=>{S.budget=+x.dataset.i; S.result=null; render()}); $("next").onclick=()=>go(1)}
  if(cur.k==="free"){$("next").onclick=()=>{S.free=$("fr").value.trim(); S.result=null; go(1)}}
  if(cur.k==="result") bindResult();
  if(cur.k==="order") bindOrder();
}
function bindResult(){
  const R=S.result;
  R.designs.forEach((x,i)=>{const c=app.querySelector(`canvas[data-th="${i}"]`); drawBracelet(c,x.d,1)});
  app.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{S.sel=+t.dataset.t; app.querySelectorAll(".tab").forEach(z=>z.setAttribute("aria-selected",z===t)); $("detail").innerHTML=detailHTML(R.designs[S.sel]); bindDetail()});
  bindDetail();
  $("toOrder").onclick=()=>go(1);
  $("restart").onclick=()=>{Object.assign(S,BLANK()); render(); window.scrollTo({top:0})};
  if(TEST_MODE) bindFeedback();
}
function bindDetail(){
  const D=S.result.designs[S.sel], d=D.d;
  app.querySelectorAll("#detail canvas[data-bead]").forEach(c=>drawSingle(c,c.dataset.bead));
  const redraw=msg=>{drawBracelet($("br"),d); const sp=specText(d); $("spec").innerHTML=`${esc(sp.line1)}<br>${esc(sp.line2)}<br>並べ方:${esc(sp.layoutName)}`; drawBracelet(app.querySelector(`canvas[data-th="${S.sel}"]`),d,1); if(msg){$("adjmsg").textContent=msg; d.log.push(msg)}};
  redraw();
  const crystalIdx=()=>{let i=d.ids.findIndex(id=>STONES[id].colors[0]==="clear"); if(i<0){d.ids.push("himalaya"); d.w.push(1); D.items.push({id:"himalaya",role:"まとめ役",why:"ほかの石の色を引き立てて、全体をまとめてくれる役です。"}); i=d.ids.length-1} return i};
  const act={
    crystal:()=>{d.w[crystalIdx()]+=1.5; return "水晶を増やしました"},
    main:()=>{d.w[0]+=2; return "メインの石を増やしました"},
    simple:()=>{d.spacer="none"; if(d.ids.length>2) d.w[2]=Math.max(.5,d.w[2]-1); d.variant=0; return "金具を外して、すっきりさせました"},
    gorgeous:()=>{d.spacer="stations"; d.variant=1; return "正面に石を集めて、ロンデルで華やかにしました"},
    lux:()=>{d.spacer="front"; if(d.size<10) d.size=10; return "玉を大きめにして、正面にロンデルを添えました"},
    size:()=>{d.size=d.size===8?10:d.size===10?12:8; return `玉の大きさを${d.size}mmにしました`},
    metal:()=>{d.metal=d.metal==="gold"?"silver":"gold"; if(d.spacer==="none") d.spacer="front"; return d.metal==="gold"?"ゴールドにしました":"シルバーにしました"},
    another:()=>{d.variant=(d.variant+1)%3; d.seed++; return VARIANTS[d.variant]+"にしました"}
  };
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const m=act[b.dataset.a](); if(b.dataset.a==="crystal"&&D.items.length!==app.querySelectorAll("#detail .stone").length){ $("detail").innerHTML=detailHTML(D); bindDetail(); $("adjmsg").textContent=m; d.log.push(m); return } redraw(m)});
}
function bindOrder(){
  const D=S.result.designs[S.sel];
  const sync=()=>{
    S.budget=+$("bg").value; S.note=$("nt").value.trim();
    drawBracelet($("br2"),D.d); const sp=specText(D.d); $("spec2").innerHTML=`${esc(sp.line1)}<br>${esc(sp.line2)}`;
    const t=orderText(); $("out").textContent=t; $("send").href=lineURL(t);
  };
  sync(); const edit=()=>{$("err").textContent=""; sync()}; ["bg","nt"].forEach(id=>{$(id).addEventListener("input",edit); $(id).addEventListener("change",edit)});
  $("send").addEventListener("click",e=>{sync();
    $("err").textContent=""; $("msg").textContent="LINEが開いたら、内容を確認して送信してください。完成図の画像も一緒に送ると、より伝わります。";});
  $("saveimg").onclick=async()=>{
    $("msg").textContent="画像を作っています…";
    const c=await makeCard(D);
    const done=()=>{const img=$("shareimg"); img.src=c.toDataURL("image/png"); img.hidden=false; $("msg").textContent="画像を長押し(パソコンは右クリック)で保存して、LINEで送ってください。"; img.scrollIntoView({block:"center"})};
    try{
      const blob=await new Promise(r=>c.toBlob(r,"image/png"));
      const file=new File([blob],"bracelet.png",{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:SITE_TITLE}); $("msg").textContent="共有画面からLINEを選んで、アッキーに送ってください。"; return }
    }catch(e){ if(e&&e.name==="AbortError"){ $("msg").textContent=""; return } }
    done();
  };
  $("copy").onclick=()=>{const t=$("out").textContent; const fb=()=>{const r=document.createRange(); r.selectNodeContents($("out")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $("msg").textContent="文字を選択しました。コピーして貼り付けてください。"};
    try{navigator.clipboard.writeText(t).then(()=>$("msg").textContent="コピーしました。",fb)}catch(e){fb()}};
}

/* ---------- アッキー用:送られてきたデザインを表示 ---------- */
function viewShared(){
  const q=new URLSearchParams(location.search).get("d"); if(!q) return false;
  const r=decodeDesign(q); if(!r) return false;
  const sp=specText(r.d);
  app.innerHTML=`<div class="stack-lg"><div class="stack" style="gap:4px"><div class="latin">Shared Design</div><h2>${esc(r.name||"お客様の")}デザイン</h2></div>
    <div class="tray"><canvas id="br" aria-label="お客様が選んだブレスレットの完成イメージ"></canvas></div>
    <p class="spec">${esc(sp.line1)}<br>${esc(sp.line2)}<br>並べ方:${esc(sp.layoutName)}</p>
    <div class="stack">${r.d.ids.map(id=>`<div class="card stone" style="padding:14px"><canvas data-bead="${id}" aria-hidden="true"></canvas><div><h3>${STONES[id].name}</h3><p class="small muted">${STONES[id].meaning}</p></div></div>`).join("")}</div>
    <a class="btn rose" href="${esc(siteURL())}">自分も診断してみる</a></div>${footer()}`;
  drawBracelet($("br"),r.d); app.querySelectorAll("canvas[data-bead]").forEach(c=>drawSingle(c,c.dataset.bead));
  return true;
}
if(!viewShared()) render();
